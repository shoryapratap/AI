<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Use a strict Content Security Policy to secure the Electron Renderer -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'">
    
    <title>Emma AI</title>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Modern Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Custom Electron Titlebar (hidden in browser, shown in Electron via JS) -->
<div class="electron-titlebar" id="electron-titlebar">
    <div class="titlebar-drag-region"></div>
    <div class="titlebar-controls">
        <button class="titlebar-btn btn-minimize" id="btn-minimize" title="Minimize">
            <svg width="10" height="1" viewBox="0 0 10 1"><rect width="10" height="1" fill="currentColor"/></svg>
        </button>
        <button class="titlebar-btn btn-maximize" id="btn-maximize" title="Maximize">
            <svg width="10" height="10" viewBox="0 0 10 10"><rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1"/></svg>
        </button>
        <button class="titlebar-btn btn-close" id="btn-close" title="Close">
            <svg width="10" height="10" viewBox="0 0 10 10"><line x1="0" y1="0" x2="10" y2="10" stroke="currentColor" stroke-width="1.2"/><line x1="10" y1="0" x2="0" y2="10" stroke="currentColor" stroke-width="1.2"/></svg>
        </button>
    </div>
</div>

    <div class="workspace-container">
        <!-- Sleek Top Navigation Bar -->
        <header class="hud-navbar">
    <div class="nav-left">
        <img src="assets/icon.png" class="logo-img" alt="Emma AI Logo">
        <span class="logo-text">EMMA<span class="logo-sub">AI</span></span>
    </div>
    <nav class="nav-links-container">
        <ul class="nav-links">
            <li class="nav-link active" data-view="main">Workspace</li>
            <li class="nav-link" data-view="settings">Settings</li>
        </ul>
    </nav>
    <div class="nav-right">
        <div class="user-profile-badge">S</div>
    </div>
</header>


        <!-- Main Workspace View Container -->
        <main class="chat-workspace" id="chat-workspace-panel">
            <!-- Shared Backing Atmosphere Glow -->
            <div class="ambient-glow" id="ambient-glow-bg"></div>
            
            <!-- 3D CUBIC ROOM WRAPPER -->
            <div class="cube-room" id="cube-room">
                
                <!-- VIEW 1: MAIN WORKSPACE VIEW -->
                <div id="main-view" class="view-panel active">
    <div class="conversational-hub">
        <!-- Input Capsule Box -->
        <div class="capsule-container">
            <div class="input-capsule">
                <button class="capsule-btn attach-btn" title="Add files">
                    <i data-lucide="plus"></i>
                </button>
                
                <input type="text" id="chat-input" placeholder="Ask Emma..." autocomplete="off">
                
                <div class="capsule-right-controls">
                    <!-- Model Selector Pill -->
                    <div class="model-selector-pill">
                        <span class="model-name">Emma-Flash</span>
                        <i data-lucide="chevron-down" class="dropdown-arrow"></i>
                    </div>
                    
                    <!-- Voice Input Button -->
                    <button class="capsule-btn mic-btn" title="Use microphone">
                        <i data-lucide="mic"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>


                <!-- VIEW 2: SETTINGS PANEL VIEW -->
                <div id="settings-view" class="view-panel">
    <div class="settings-hub">
        <h2 class="settings-title">Settings Configurations</h2>
        
        <div class="settings-grid">
            <!-- Card 1: Model parameters -->
            <div class="settings-card">
                <div class="card-header">
                    <i data-lucide="cpu"></i>
                    <h3>Kernel Model</h3>
                </div>
                <div class="card-body">
                    <div class="form-group">
                        <label for="setting-model">Active Agent Model</label>
                        <select id="setting-model">
                            <option value="flash">Emma-Flash (Low Latency)</option>
                            <option value="pro" selected>Emma-Pro (Balanced)</option>
                            <option value="ultra">Emma-Ultra (High Reasoning)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="setting-temp">Temperature (Creativity)</label>
                        <div class="slider-group">
                            <input type="range" id="setting-temp" min="0" max="100" value="70">
                            <span id="temp-val">0.7</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Card 2: Environment API Keys -->
            <div class="settings-card">
                <div class="card-header">
                    <i data-lucide="key-round"></i>
                    <h3>API Credentials</h3>
                </div>
                <div class="card-body">
                    <div class="form-group">
                        <label for="setting-groq">GroqCloud API Token</label>
                        <input type="password" id="setting-groq" placeholder="gsk_xxxxxxxxxxxxxxxx" value="gsk_demo_credentials_val">
                    </div>
                    <div class="form-group">
                        <label for="setting-openai">OpenAI API Key</label>
                        <input type="password" id="setting-openai" placeholder="sk-proj-xxxxxxxxxxxxxxxx">
                    </div>
                </div>
            </div>

            <!-- Card 3: System Voice options -->
            <div class="settings-card">
                <div class="card-header">
                    <i data-lucide="volume-2"></i>
                    <h3>Audio & Voice</h3>
                </div>
                <div class="card-body">
                    <div class="toggle-row">
                        <div class="toggle-info">
                            <h4>Speech Synthesis</h4>
                            <span>Synthesize voice responses locally</span>
                        </div>
                        <label class="switch-toggle">
                            <input type="checkbox" id="setting-speech" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="toggle-row">
                        <div class="toggle-info">
                            <h4>High Sensitivity Mic</h4>
                            <span>Lower trigger delay for dictation</span>
                        </div>
                        <label class="switch-toggle">
                            <input type="checkbox" id="setting-micsens">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Card 4: Aesthetics & UI Theme -->
            <div class="settings-card">
                <div class="card-header">
                    <i data-lucide="palette"></i>
                    <h3>Glow Preferences</h3>
                </div>
                <div class="card-body">
                    <div class="form-group">
                        <label>Atmosphere Backdrop Color</label>
                        <div class="color-picker-grid">
                            <button class="color-btn active" data-color="indigo" style="background-color: #6366f1;"></button>
                            <button class="color-btn" data-color="purple" style="background-color: #a855f7;"></button>
                            <button class="color-btn" data-color="emerald" style="background-color: #10b981;"></button>
                            <button class="color-btn" data-color="rose" style="background-color: #f43f5e;"></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="settings-footer">
            <button class="save-btn" id="save-settings-btn">Apply Configs</button>
            <span id="save-status" class="save-status hidden">Saved!</span>
        </div>
    </div>
</div>


            </div>

        </main>
    </div>

    <!-- Script Entry -->
    <script src="app.js"></script>
    <script>
        // Initialize icons
        lucide.createIcons();
    </script>
</body>
</html>
